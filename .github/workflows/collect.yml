name: Build Bago Block Gazette

on:
  workflow_dispatch:
    inputs:
      historical_import:
        description: Import all ESPN historical seasons
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - .github/workflows/collect.yml
      - collector.py
      - generate_gazette.py
      - generate_monday_preview.py
      - build_awards.py
      - build_history.py
      - build_all_time.py
      - historical_import.py
      - analyze_week.py
      - build_week_details.py
      - build_site.py
      - requirements.txt
  schedule:
    # Monday morning Sunday-wrap edition: 13:00 UTC = 8 AM CDT / 7 AM CST
    - cron: "0 13 * * 1"
    # Tuesday final edition after MNF: 14:00 UTC = 9 AM CDT / 8 AM CST
    - cron: "0 14 * * 2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: One-time historical archive
        if: (github.event_name == 'workflow_dispatch' && inputs.historical_import == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[historical-import]'))
        env:
          ESPN_LEAGUE_ID: "1724229206"
          ESPN_SEASON: "2026"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python historical_import.py
          python build_all_time.py
      - name: Commit certified historical master
        if: (github.event_name == 'workflow_dispatch' && inputs.historical_import == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[historical-import]'))
        run: |
          git config user.name "bago-block-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/historical/ data/manager_identities.json data/league_lineage.json
          git diff --cached --quiet || git commit -m "Certify historical master ledger"
          git push
      - name: Collect ESPN data
        env:
          ESPN_LEAGUE_ID: "1724229206"
          ESPN_SEASON: "2026"
        run: python collector.py
      - name: Build Monday morning edition
        if: github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1'
        run: python generate_monday_preview.py
      - name: Build final weekly analysis
        if: github.event_name != 'schedule' || github.event.schedule == '0 14 * * 2'
        run: |
          python generate_monday_preview.py
          python build_awards.py
          python build_history.py
          python analyze_week.py
          python build_week_details.py
          python generate_gazette.py
          python build_site.py
      - name: Commit publication
        run: |
          git config user.name "bago-block-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ gazette/ site/
          git diff --cached --quiet && exit 0
          git commit -m "Publish Bago Block Gazette"
          git push
