name: Collect ESPN league data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 2"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect Bago Block
        env:
          ESPN_LEAGUE_ID: "1724229206"
          ESPN_SEASON: "2026"
        run: python collector.py
      - name: Commit snapshots
        run: |
          git config user.name "bago-block-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update ESPN league snapshot"
          git push
